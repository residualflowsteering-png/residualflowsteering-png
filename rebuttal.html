    /* Collapsible Section Styling */
    details > summary {
      background-color: #3273dc;
      color: white;
      padding: 10px 15px;

      border-radius: 6px;
      margin: 20px 0 15px;
      cursor: pointer;

    details > summary::marker {
      display: none;
    }
    summary::after {
      content: "+";
      font-size: 1.2em;
      font-weight: bold;
    }
    details[open] summary::after {

    /* Inner content box */

      background: #fafafa;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 6px 6px;

      display: block;
